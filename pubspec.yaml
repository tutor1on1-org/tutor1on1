name: tutor1on1
description: Tutor1on1 client with LLM-backed tutoring and skill trees.
publish_to: "none"
version: 1.0.61

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  drift: ^2.30.0
  drift_flutter: ^0.2.8
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  crypto: ^3.0.3
  cryptography: ^2.7.0
  intl: ^0.20.2
  json_schema: ^5.2.0
  file_picker: ^8.0.6
  uuid: ^4.4.0
  flutter_math_fork: ^0.7.2
  graphview: ^1.2.0
  just_audio: ^0.9.38
  markdown: ^7.2.2
  record: ^5.1.2
  archive: ^3.6.1
  package_info_plus: ^9.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.11
  drift_dev: ^2.30.0
  sqlite3: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/prompts/learn.prompt.txt
    - assets/prompts/review_init.prompt.txt
    - assets/prompts/review_cont.prompt.txt
    - assets/prompts/course_builder_content.prompt.txt
    - assets/prompts/course_builder_question.prompt.txt
    - assets/schemas/review_cont.schema.json
    - assets/textbooks/math_outline_y5_y12.txt
    - assets/teachers/
